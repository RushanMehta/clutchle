<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clutchle - The Daily Word Game</title>
    <meta name="description" content="Play Clutchle! Guess the secret 5-letter word in 6 tries. A new word every day!">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #121213;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 10px 20px;
            border-bottom: 1px solid #3a3a3c;
        }

        h1 {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            flex-grow: 1;
            padding: 20px 10px;
        }

        #grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 5px;
            width: 350px;
            height: 420px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
        }

        .tile {
            border: 2px solid #3a3a3c;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
        }

        .tile[data-state="correct"] {
            background-color: #538d4e;
            border-color: #538d4e;
        }

        .tile[data-state="present"] {
            background-color: #b59f3b;
            border-color: #b59f3b;
        }

        .tile[data-state="absent"] {
            background-color: #3a3a3c;
            border-color: #3a3a3c;
        }

        #message {
            height: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 10px 0;
            text-align: center;
        }

        #keyboard {
            width: 100%;
            max-width: 500px;
        }

        .kbd-row {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
            touch-action: manipulation;
        }

        .key {
            background-color: #818384;
            color: white;
            border: 0;
            border-radius: 4px;
            height: 58px;
            margin: 0 3px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-transform: uppercase;
            flex: 1;
            user-select: none;
        }

        .key-wide {
            flex: 1.5;
            font-size: 0.8rem;
        }

        .key[data-state="correct"] {
            background-color: #538d4e;
        }

        .key[data-state="present"] {
            background-color: #b59f3b;
        }

        .key[data-state="absent"] {
            background-color: #3a3a3c;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: #121213;
            border: 1px solid #3a3a3c;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal h2 {
            margin-bottom: 15px;
        }

        .modal p {
            margin-bottom: 10px;
            line-height: 1.4;
            color: #d7dedc;
        }
    </style>
</head>
<body>

    <header>
        <button id="help-btn" class="icon-btn">?</button>
        <h1>CLUTCHLE</h1>
        <div style="width: 24px;"></div>
    </header>

    <div id="game-container">
        <div id="grid"></div>
        <div id="message"></div>
        
        <div id="keyboard">
            <div class="kbd-row">
                <button class="key" data-key="Q">Q</button>
                <button class="key" data-key="W">W</button>
                <button class="key" data-key="E">E</button>
                <button class="key" data-key="R">R</button>
                <button class="key" data-key="T">T</button>
                <button class="key" data-key="Y">Y</button>
                <button class="key" data-key="U">U</button>
                <button class="key" data-key="I">I</button>
                <button class="key" data-key="O">O</button>
                <button class="key" data-key="P">P</button>
            </div>
            <div class="kbd-row">
                <button class="key" data-key="A">A</button>
                <button class="key" data-key="S">S</button>
                <button class="key" data-key="D">D</button>
                <button class="key" data-key="F">F</button>
                <button class="key" data-key="G">G</button>
                <button class="key" data-key="H">H</button>
                <button class="key" data-key="J">J</button>
                <button class="key" data-key="K">K</button>
                <button class="key" data-key="L">L</button>
            </div>
            <div class="kbd-row">
                <button class="key key-wide" data-key="ENTER">ENTER</button>
                <button class="key" data-key="Z">Z</button>
                <button class="key" data-key="X">X</button>
                <button class="key" data-key="C">C</button>
                <button class="key" data-key="V">V</button>
                <button class="key" data-key="B">B</button>
                <button class="key" data-key="N">N</button>
                <button class="key" data-key="M">M</button>
                <button class="key key-wide" data-key="BACKSPACE">DEL</button>
            </div>
        </div>
    </div>

    <div id="rules-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <h2>How To Play</h2>
            <p>Guess the <strong>CLUTCHLE</strong> in 6 tries.</p>
            <p>• Each guess must be a valid 5-letter word.</p>
            <p>• The color of the tiles will change to show how close your guess was to the word.</p>
            <p>• A new word is available each day!</p>
        </div>
    </div>

    <script>
        const rawAnswers = [
            "APPLE", "BEACH", "CHIEF", "DRIVE", "EARTH", "FLUTE", "GRAPE", "HOUSE", 
            "INDEX", "JUICE", "KNIFE", "LIGHT", "MONEY", "NIGHT", "OCEAN", "PLANT", 
            "QUEEN", "RADIO", "SNAKE", "TRAIN", "UNDER", "VOICE", "WATER", "YOUTH",
            "ABOUT", "ADMIT", "ADULT", "AFTER", "AGREE", "ALIVE", "ALONE", "ALONG",
            "ALTER", "AMONG", "ANGER", "ANGLE", "ANGRY", "APART", "ARGUE", "ARRAY",
            "ARROW", "ASSET", "AUDIO", "AWAKE", "AWARD", "BASIC", "BEGIN", "BLACK",
            "BLIND", "BLOCK", "BLOOD", "BOARD", "BOOST", "BRAIN", "BRAVE", "BREAD",
            "BREAK", "BRICK", "BRING", "BROKE", "BROWN", "BRUSH", "BUILD", "BUILT",
            "BUNCH", "BUYER", "CABLE", "CALM", "CANDY", "CARRY", "CARVE", "CATCH",
            "CAUSE", "CHAIN", "CHAIR", "CHAMP", "CHART", "CHASE", "CHEAP", "CHECK",
            "CHEST", "CHILD", "CHIPS", "CHOIR", "CHOSE", "CLAIM", "CLASS", "CLEAN",
            "CLEAR", "CLIMB", "CLOCK", "CLOSE", "CLOTH", "CLOUD", "COACH", "COAST",
            "COUNT", "COURT", "COVER", "CREAM", "CROWD", "CROWN", "DANCE", "DEPTH", 
            "DRAFT", "DRAMA", "DREAM", "DRESS", "DRINK", "ENEMY", "ENTRY", "FAITH", 
            "FAULT", "FIELD", "FIGHT", "FINAL", "FLOOR", "FOCUS", "FORCE", "FRAME", 
            "FRONT", "FRUIT", "GLASS", "GLOVE", "SMILE", "SMOKE", "SOUND", "SPACE", 
            "SPEED", "SPEND", "SPOON", "STAGE", "STAND", "START", "STATE", "STEAM", 
            "STEEL", "STICK", "STILL", "STONE", "DAILY", "DELAY", "DEVIL", "DIRTY", 
            "DONKEY", "DOUBT", "DOZEN", "EAGLE", "EARLY", "EMPTY", "ENJOY", "EQUAL", 
            "ERROR", "EVENT", "EVERY", "EXTRA", "FAINT", "FALSE", "FANCY", "FATAL", 
            "FEVER", "FIFTH", "FIRST", "FIXED", "FLAME", "FLASH", "FLESH", "FLOAT", 
            "FLOOD", "FLUID", "FLYER", "FOCUS", "FORCE", "FORTH", "FORTY", "FORUM", 
            "FOUND", "FRAME", "FRESH", "FRONT", "FRUIT", "FUNNY", "GIANT", "GIVEN", 
            "GLASS", "GLOBE", "GLORY", "GLOVE", "GRACE", "GRADE", "GRAND", "GRANT", 
            "GRASS", "GRAVE", "GREAT", "GREEN", "GREET", "GRIEF", "GROSS", "GROUP", 
            "GROWN", "GUARD", "GUESS", "GUEST", "GUIDE", "HABIT", "HAPPY", "HARSH", 
            "HEART", "HEAVY", "HELLO", "HONEY", "HONOR", "HORSE", "HOTEL", "HUMAN", 
            "HUMOR", "IDEAL", "IMAGE", "IMPLY", "INNER", "INPUT", "IRONY", "ISSUE", 
            "ITEMS", "IVORY", "JACKET", "JOINT", "JUDGE", "JUICY", "LEMON", "LEVEL", 
            "LEVER", "LIGHT", "LIMIT", "LINER", "LOGIC", "LOOSE", "LOVER", "LOWER", 
            "LUCKY", "LUNCH", "LYRIC", "MAGIC", "MAJOR", "MAKER", "MARCH", "MATCH", 
            "MAYOR", "MEANSM", "MEDAL", "MEDIA", "MERCY", "MERIT", "METAL", "MICRO", 
            "MIDST", "MIGHT", "MINOR", "MINUS", "MIXED", "MODEL", "MODEM", "MOIST", 
            "MONEY", "MONTH", "MORAL", "MOTOR", "MOUNT", "MOUSE", "MOUTH", "MOVIE", 
            "MUSIC", "MYTHS", "NAKED", "NASTY", "NAVAL", "NEEDS", "NEVER", "NEWER", 
            "NIGHT", "NINTH", "NOBLE", "NOISE", "NORTH", "NOTED", "NOVEL", "NURSE", 
            "OCCUR", "OCEAN", "OFFER", "OFTEN", "ORDER", "OTHER", "OUTER", "OWNER", 
            "PANEL", "PAPER", "PARTY", "PATCH", "PATHS", "PATIO", "PAUSE", "PEACE", 
            "PEACH", "PEARL", "PEDAL", "PHASE", "PHONE", "PHOTO", "PIANO", "PICKY", 
            "PILOT", "PITCH", "PIXEL", "PIZZA", "PLACE", "PLAIN", "PLANE", "PLANT", 
            "PLATE", "PLAYS", "PLAZA", "PLEAD", "PLUCK", "POEMS", "POINT", "POKER", 
            "POLAR", "POLES", "POLIO", "POLITE", "POLYP", "PONEY", "POOLS", "PORCH", 
            "PORTS", "POUND", "POWER", "PRESS", "PRICE", "PRIDE", "PRIME", "PRINT", 
            "PRIOR", "PRIZE", "PROBE", "PROMO", "PROUD", "PROVE", "PROXYS", "PULSE", 
            "PUNCH", "PUPIL", "PUPPY", "PURELY", "PURSE", "QUEEN", "QUERY", "QUEST", 
            "QUEUE", "QUICK", "QUIET", "QUILT", "QUITE", "QUOTA", "QUOTE", "RACING", 
            "RADAR", "RADIO", "RAILS", "RAINY", "RAISE", "RALLY", "RAMCH", "RANGE", 
            "RAPID", "RATIO", "RAZOR", "REACH", "REACT", "READY", "REALM", "REBEL", 
            "REFER", "REIGN", "RELAX", "REPLY", "RESET", "RESIN", "RETRO", "RIDER", 
            "RIDGE", "RIFLE", "RIGHT", "RIGID", "RINGS", "RINSE", "RISKY", "RIVAL", 
            "RIVER", "ROADS", "ROBOT", "ROCKS", "ROCKY", "ROGUE", "ROLES", "ROMAN", 
            "ROOF", "ROOMS", "ROOMY", "ROOTS", "ROTOR", "ROUGH", "ROUND", "ROUTE", 
            "ROWER", "ROYAL", "RUBBER", "RUDE", "RUINS", "RULER", "RURAL", "SABER", 
            "SACK", "SADLY", "SAFER", "SAFETY", "SAGE", "SAIL", "SALAD", "SALES", 
            "SALON", "SALSA", "SALTY", "SAME", "SANDY", "SATIN", "SAUCE", "SAUCY", 
            "SAVED", "SAVIOR", "SAVOR", "SCALE", "SCALP", "SCANT", "SCARE", "SCARF", 
            "SCARY", "SCENE", "SCENT", "SCOLD", "SCOOP", "SCOPE", "SCORE", "SCORN", 
            "SCOUT", "SCRAP", "SCREW", "SCRIP", "SCUBA", "SEALS", "SEAM", "SEATS", 
            "SECTOR", "SEDAN", "SEEDS", "SEEDY", "SEEKER", "SEEMS", "SEGMENT", "SEIZE", 
            "SELLER", "SENIOR", "SENSE", "SERUM", "SERVE", "SETUP", "SEVEN", "SEVERE", 
            "SHACK", "SHADE", "SHADO", "SHADY", "SHAFT", "SHAKE", "SHAKY", "SHALE", 
            "SHALL", "SHAME", "SHANK", "SHAPE", "SHARE", "SHARK", "SHARP", "SHAVE", 
            "SHAWL", "SHEAR", "SHED", "SHEEP", "SHEER", "SHEET", "SHELF", "SHELL", 
            "SHIFT", "SHINE", "SHINY", "SHIPS", "SHIRT", "SHOCK", "SHOES", "SHOON", 
            "SHOOT", "SHOPS", "SHORE", "SHORT", "SHOT", "SHOUT", "SHOVE", "SHOWN", 
            "SHOWY", "SHRED", "SHREW", "SHRUB", "SHRUG", "SHUN", "SHUT", "SHYLY", 
            "SICKLY", "SIDE", "SIEGE", "SIGHT", "SIGMA", "SIGN", "SILENT", "SILK", 
            "SILKY", "SILLY", "SILVER", "SIMPLY", "SINCE", "SINFUL", "SING", "SINGER"
        ];

        // Keeps only 5-letter words and removes words ending in 'S'
        const commonAnswers = rawAnswers.filter(word => word.length === 5 && !word.endsWith("S"));

        function getDailySecretWord() {
            const today = new Date();
            const dateNum = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
            const randomIndex = Math.abs(Math.sin(dateNum) * 10000) % commonAnswers.length;
            return commonAnswers[Math.floor(randomIndex)];
        }

        const targetWord = getDailySecretWord();

        const grid = document.getElementById("grid");
        const messageEl = document.getElementById("message");
        const rulesModal = document.getElementById("rules-modal");
        const helpBtn = document.getElementById("help-btn");
        const closeModal = document.getElementById("close-modal");

        let currentLine = 0;
        let currentTile = 0;
        let isGameOver = false;
        const guesses = ["", "", "", "", "", ""];

        // Initialize grid
        function buildGrid() {
            for (let r = 0; r < 6; r++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let c = 0; c < 5; c++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    tile.id = `tile-${r}-${c}`;
                    row.appendChild(tile);
                }
                grid.appendChild(row);
            }
        }

        buildGrid();

        // Modal Controls
        helpBtn.onclick = () => rulesModal.style.display = "flex";
        closeModal.onclick = () => rulesModal.style.display = "none";
        window.onclick = (e) => {
            if (e.target === rulesModal) rulesModal.style.display = "none";
        };

        // Key Press Events
        document.addEventListener("keydown", (e) => handleKeyPress(e.key.toUpperCase()));

        document.querySelectorAll(".key").forEach(button => {
            button.addEventListener("click", () => {
                const key = button.getAttribute("data-key");
                handleKeyPress(key);
            });
        });

        function handleKeyPress(key) {
            if (isGameOver) return;

            if (key === "ENTER") {
                submitGuess();
            } else if (key === "BACKSPACE" || key === "DELETE") {
                deleteLetter();
            } else if (/^[A-Z]$/.test(key)) {
                addLetter(key);
            }
        }

        function addLetter(letter) {
            if (currentTile < 5 && currentLine < 6) {
                guesses[currentLine] += letter;
                const tile = document.getElementById(`tile-${currentLine}-${currentTile}`);
                tile.textContent = letter;
                currentTile++;
            }
        }

        function deleteLetter() {
            if (currentTile > 0) {
                currentTile--;
                guesses[currentLine] = guesses[currentLine].slice(0, -1);
                const tile = document.getElementById(`tile-${currentLine}-${currentTile}`);
                tile.textContent = "";
            }
        }

        function submitGuess() {
            const guess = guesses[currentLine];

            if (guess.length !== 5) {
                showMessage("Not enough letters");
                return;
            }

            revealGuess(guess);

            if (guess === targetWord) {
                showMessage("Clutch! You won! 🎉");
                isGameOver = true;
            } else if (currentLine === 5) {
                showMessage(`Game Over! Word was: ${targetWord}`);
                isGameOver = true;
            } else {
                currentLine++;
                currentTile = 0;
            }
        }

        function revealGuess(guess) {
            const rowTiles = document.querySelectorAll(`#grid .row:nth-child(${currentLine + 1}) .tile`);
            const targetLetterCounts = {};

            for (let l of targetWord) {
                targetLetterCounts[l] = (targetLetterCounts[l] || 0) + 1;
            }

            const guessStates = Array(5).fill("absent");

            // First pass: mark correct green tiles
            for (let i = 0; i < 5; i++) {
                if (guess[i] === targetWord[i]) {
                    guessStates[i] = "correct";
                    targetLetterCounts[guess[i]]--;
                }
            }

            // Second pass: mark yellow tiles
            for (let i = 0; i < 5; i++) {
                if (guessStates[i] !== "correct" && targetLetterCounts[guess[i]] > 0) {
                    guessStates[i] = "present";
                    targetLetterCounts[guess[i]]--;
                }
            }

            // Apply states to tiles & onscreen keyboard
            for (let i = 0; i < 5; i++) {
                rowTiles[i].setAttribute("data-state", guessStates[i]);
                const keyButton = document.querySelector(`.key[data-key="${guess[i]}"]`);
                if (keyButton) {
                    const currentState = keyButton.getAttribute("data-state");
                    if (guessStates[i] === "correct" || currentState !== "correct") {
                        keyButton.setAttribute("data-state", guessStates[i]);
                    }
                }
            }
        }

        function showMessage(msg) {
            messageEl.textContent = msg;
            setTimeout(() => {
                if (!isGameOver) messageEl.textContent = "";
            }, 2000);
        }
    </script>
</body>
</html>
